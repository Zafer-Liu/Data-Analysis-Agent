<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>智析Agent — 登录</title>
  <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0f172a;color:#e2e8f0;min-height:100vh;display:flex;align-items:center;justify-content:center}
    .login-card{background:#1e293b;border:1px solid #334155;border-radius:16px;padding:40px;width:380px;max-width:90vw;box-shadow:0 20px 60px rgba(0,0,0,.4)}
    .login-logo{font-size:28px;font-weight:700;text-align:center;margin-bottom:8px;background:linear-gradient(135deg,#60a5fa,#818cf8);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
    .login-subtitle{text-align:center;font-size:13px;color:#94a3b8;margin-bottom:28px}
    .login-subtitle a{color:#818cf8;text-decoration:none;font-weight:700}
    .form-group{margin-bottom:16px}
    .form-label{display:block;font-size:13px;color:#cbd5e1;margin-bottom:6px}
    .form-input{width:100%;padding:10px 14px;background:#0f172a;border:1px solid #475569;border-radius:8px;color:#e2e8f0;font-size:14px;outline:none;transition:border .15s}
    .form-input:focus{border-color:#6366f1}
    .code-row{display:flex;gap:8px}
    .code-row .form-input{flex:1}
    .code-btn{flex-shrink:0;padding:10px 16px;background:#334155;border:1px solid #475569;border-radius:8px;color:#94a3b8;font-size:13px;cursor:pointer;white-space:nowrap;transition:background .15s,opacity .15s}
    .code-btn:hover:not(:disabled){background:#3e4e66;color:#e2e8f0}
    .code-btn:disabled{opacity:.5;cursor:not-allowed}
    .btn{width:100%;padding:11px;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;transition:background .15s,opacity .15s}
    .btn-primary{background:#6366f1;color:#fff}
    .btn-primary:hover{background:#4f46e5}
    .btn:disabled{opacity:.5;cursor:not-allowed}
    .form-error{color:#f87171;font-size:13px;text-align:center;min-height:20px;margin-bottom:8px}
    .tab-row{display:flex;gap:0;margin-bottom:24px;border:1px solid #334155;border-radius:8px;overflow:hidden}
    .tab-btn{flex:1;padding:10px;background:transparent;border:none;color:#94a3b8;font-size:14px;cursor:pointer;transition:background .15s}
    .tab-btn.active{background:#334155;color:#e2e8f0}
    .spinner{display:inline-block;width:14px;height:14px;border:2px solid #6366f1;border-top-color:transparent;border-radius:50%;animation:spin .6s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .agree-row{display:flex;align-items:flex-start;gap:8px;margin-top:16px;font-size:12px;color:#94a3b8}
    .agree-row input{margin-top:2px;accent-color:#6366f1}
    .agree-row a{color:#818cf8;text-decoration:none;cursor:pointer}
    .agree-row a:hover{text-decoration:underline}
    .agreement-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:100;padding:20px}
    .agreement-overlay.show{display:flex}
    .agreement-box{background:#1e293b;border:1px solid #334155;border-radius:12px;padding:32px;max-width:520px;max-height:70vh;overflow-y:auto;font-size:13px;line-height:1.7;color:#cbd5e1}
    .agreement-box h3{color:#e2e8f0;font-size:16px;margin-bottom:16px}
    .agreement-box h4{color:#818cf8;font-size:14px;margin:16px 0 6px}
    .agreement-box p{margin-bottom:8px}
    .agreement-box .close-btn{margin-top:20px;width:100%;padding:9px;background:#6366f1;border:none;border-radius:8px;color:#fff;font-size:14px;cursor:pointer}
    .agreement-box .close-btn:hover{background:#4f46e5}
  </style>
</head>
<body>
  <div class="login-card">
    <img src="/static/Images/icon-sm.png" alt="智析 Agent" width="56" height="56" style="border-radius:14px;display:block;margin:0 auto 12px" loading="eager">
    <div class="login-logo">智析Agent</div>
    <div class="login-subtitle">v1.4.0 LTS · <a href="https://www.zaferliu.me" target="_blank" rel="noopener noreferrer">@Zafer_Liu</a></div>

    <div class="tab-row">
      <button class="tab-btn active" id="tab-login" data-tab="login">登录</button>
      <button class="tab-btn" id="tab-register" data-tab="register">注册</button>
    </div>

    <div id="form-login">
      <div class="form-group">
        <label class="form-label">邮箱</label>
        <input class="form-input" id="login-email" type="email" autocomplete="email" placeholder="输入邮箱">
      </div>
      <div class="form-group">
        <label class="form-label">密码</label>
        <input class="form-input" id="login-password" type="password" autocomplete="current-password" placeholder="输入密码">
      </div>
      <div class="form-error" id="login-error"></div>
      <button class="btn btn-primary" id="login-btn">登录</button>
    </div>

    <div id="form-register" style="display:none">
      <div class="form-group">
        <label class="form-label">邮箱</label>
        <input class="form-input" id="reg-email" type="email" autocomplete="email" placeholder="输入邮箱">
      </div>
      <div class="form-group">
        <label class="form-label">验证码</label>
        <div class="code-row">
          <input class="form-input" id="reg-code" type="text" maxlength="6" placeholder="6 位验证码" inputmode="numeric">
          <button class="code-btn" id="send-code-btn">发送验证码</button>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">密码</label>
        <input class="form-input" id="reg-password" type="password" autocomplete="new-password" placeholder="4 个字符以上">
      </div>
      <div class="form-error" id="reg-error"></div>
      <button class="btn btn-primary" id="reg-btn">注册</button>
    </div>

    <label class="agree-row">
      <input type="checkbox" id="agree-check">
      <span>我已阅读并同意<a id="agree-link">《智析Agent用户协议》</a></span>
    </label>
  </div>

  <div class="agreement-overlay" id="agreement-overlay">
    <div class="agreement-box">
      {{ agreement_html|safe }}
      <button class="close-btn" id="agree-close-btn">我已阅读</button>
    </div>
  </div>

  <script src="/static/js/login.js"></script>
</body>
</html>
