<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f4f6fa">
  <title>智析Agent — 登录</title>
  <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}">
  <script src="{{ url_for('static', filename='js/theme_bootstrap.js', v='fe0') }}"></script>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/parts/tokens.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css', v='20261009-1') }}">
</head>
<body>
  <main class="auth-shell">
    <section class="auth-story" aria-labelledby="story-title">
      <a class="brand" href="https://sage-agent.online" target="_blank" rel="noopener noreferrer" aria-label="智析Agent 官网" data-i18n-aria-label="brand.website">
        <img src="/static/Images/icon-sm.png" alt="" width="48" height="48" loading="eager">
        <span class="brand-copy">
          <strong data-i18n="brand.name">智析Agent</strong>
          <small data-i18n="brand.tagline">INTELLIGENT ANALYSIS</small>
        </span>
      </a>

      <div class="story-copy">
        <p class="story-eyebrow">DATA ANALYSIS WORKSPACE</p>
        <h1 id="story-title" aria-label="让复杂数据，变成清晰判断。" data-i18n-aria-label="story.title_full"><span class="story-title-line" data-i18n="story.title_line_1">让复杂数据，</span><br><span class="story-title-accent" data-i18n="story.title_line_2">变成清晰判断。</span></h1>
        <p class="story-summary" data-i18n="story.summary">从原始数据到可执行结论，在同一个工作区完成分析、验证与表达。</p>
      </div>

      <div class="analysis-trace" aria-hidden="true">
        <svg viewBox="0 0 660 252" preserveAspectRatio="none">
          <defs>
            <linearGradient id="trace-gradient" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0" stop-color="#5867e8" stop-opacity=".18"/>
              <stop offset=".54" stop-color="#7582ff"/>
              <stop offset="1" stop-color="#50c8ec"/>
            </linearGradient>
          </defs>
          <g class="trace-grid">
            <path d="M0 42H660M0 105H660M0 168H660M0 231H660"/>
            <path d="M76 0V252M221 0V252M366 0V252M511 0V252"/>
          </g>
          <path class="trace-area" d="M18 210C94 203 111 157 176 162S275 204 334 135 436 102 492 78 573 96 642 28V252H18Z"/>
          <path class="trace-line" pathLength="1" d="M18 210C94 203 111 157 176 162S275 204 334 135 436 102 492 78 573 96 642 28"/>
          <g class="trace-points">
            <circle cx="176" cy="162" r="5"/>
            <circle cx="334" cy="135" r="5"/>
            <circle cx="492" cy="78" r="5"/>
            <circle cx="642" cy="28" r="6"/>
          </g>
        </svg>
        <div class="trace-label trace-label--one"><span>01</span><span class="trace-label-copy" data-i18n="trace.import">导入</span></div>
        <div class="trace-label trace-label--two"><span>02</span><span class="trace-label-copy" data-i18n="trace.analyze">分析</span></div>
        <div class="trace-label trace-label--three"><span>03</span><span class="trace-label-copy" data-i18n="trace.decide">决策</span></div>
      </div>

      <div class="story-footer">
        <span>v1.3.0 LTS</span>
        <a href="https://www.zaferliu.me" target="_blank" rel="noopener noreferrer">@Zafer_Liu</a>
      </div>
    </section>

    <section class="auth-panel" aria-label="账户登录与注册" data-i18n-aria-label="auth.region">
      <div class="auth-toolbar">
        <div class="mobile-brand" aria-hidden="true">
          <img src="/static/Images/icon-sm.png" alt="" width="40" height="40">
          <div><strong data-i18n="brand.name">智析Agent</strong><span data-i18n="brand.mobile_subtitle">智能数据分析工作台</span></div>
        </div>
      </div>

      <div class="auth-heading">
        <p class="auth-kicker">WELCOME</p>
        <h2 data-i18n="auth.heading">进入你的分析工作台</h2>
        <p data-i18n="auth.description">登录或创建账户，继续处理你的数据任务。</p>
      </div>

      <div class="tab-row" id="auth-tabs" role="tablist" aria-label="账户操作" data-i18n-aria-label="auth.tabs">
        <button class="tab-btn active" id="tab-login" type="button" role="tab" aria-selected="true" aria-controls="form-login" data-tab="login" data-i18n="tab.login">登录</button>
        <button class="tab-btn" id="tab-register" type="button" role="tab" aria-selected="false" aria-controls="form-register" data-tab="register" data-i18n="tab.register">注册</button>
      </div>

      <div id="form-login" role="tabpanel" aria-labelledby="tab-login">
        <div class="form-group">
          <label class="form-label" for="login-email" data-i18n="field.email">邮箱</label>
          <div class="input-shell">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.75 6.75A2.25 2.25 0 0 1 6 4.5h12a2.25 2.25 0 0 1 2.25 2.25v10.5A2.25 2.25 0 0 1 18 19.5H6a2.25 2.25 0 0 1-2.25-2.25V6.75Z"/><path d="m4.5 7.5 6.06 4.34a2.5 2.5 0 0 0 2.88 0L19.5 7.5"/></svg>
            <input class="form-input" id="login-email" type="email" autocomplete="email" placeholder="name@example.com">
          </div>
        </div>
        <div class="form-group">
          <label class="form-label" for="login-password" data-i18n="field.password">密码</label>
          <div class="input-shell">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
            <input class="form-input" id="login-password" type="password" autocomplete="current-password" placeholder="输入登录密码" data-i18n-placeholder="placeholder.password">
          </div>
        </div>
        <div class="form-error" id="login-error" aria-live="polite"></div>
        <button class="btn btn-primary" id="login-btn" type="button"><span data-i18n="action.login">登录</span><span aria-hidden="true">→</span></button>
      </div>

      <div id="form-register" role="tabpanel" aria-labelledby="tab-register" style="display:none">
        <div class="form-group">
          <label class="form-label" for="reg-email" data-i18n="field.email">邮箱</label>
          <div class="input-shell">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.75 6.75A2.25 2.25 0 0 1 6 4.5h12a2.25 2.25 0 0 1 2.25 2.25v10.5A2.25 2.25 0 0 1 18 19.5H6a2.25 2.25 0 0 1-2.25-2.25V6.75Z"/><path d="m4.5 7.5 6.06 4.34a2.5 2.5 0 0 0 2.88 0L19.5 7.5"/></svg>
            <input class="form-input" id="reg-email" type="email" autocomplete="email" placeholder="name@example.com">
          </div>
        </div>
        <div class="form-group">
          <label class="form-label" for="reg-code" data-i18n="field.code">验证码</label>
          <div class="code-row">
            <input class="form-input form-input--plain" id="reg-code" type="text" maxlength="6" autocomplete="one-time-code" placeholder="6 位验证码" inputmode="numeric" data-i18n-placeholder="placeholder.code">
            <button class="code-btn" id="send-code-btn" type="button" data-i18n="action.send_code">发送验证码</button>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label" for="reg-password" data-i18n="field.password">密码</label>
          <div class="input-shell">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
            <input class="form-input" id="reg-password" type="password" autocomplete="new-password" placeholder="4 个字符以上">
          </div>
        </div>
        <div class="form-error" id="reg-error" aria-live="polite"></div>
        <button class="btn btn-primary" id="reg-btn" type="button"><span data-i18n="action.register">创建账户</span><span aria-hidden="true">→</span></button>
      </div>

      <label class="agree-row" id="agreement-row">
        <input type="checkbox" id="agree-check">
        <span><span data-i18n="agreement.prefix">我已阅读并同意</span><a id="agree-link" href="#agreement-overlay" data-i18n="agreement.link">《智析Agent用户协议》</a></span>
      </label>
    </section>
  </main>

  <div class="agreement-overlay" id="agreement-overlay" role="dialog" aria-modal="true" aria-label="智析Agent用户协议" data-i18n-aria-label="agreement.dialog">
    <div class="agreement-box">
      {{ agreement_html|safe }}
      <button class="close-btn" id="agree-close-btn" type="button" data-i18n="agreement.close">我已阅读</button>
    </div>
  </div>

  <script src="{{ url_for('static', filename='js/login.js', v='20261009-1') }}"></script>
</body>
</html>
