intents:
  aggregate_metric:
    examples:
    - 高二(1)班2025-2026学年第一学期数学平均分是多少
    - 各班级英语及格率
    - 我的数学成绩是多少
    required_slots:
    - metric
    optional_slots:
    - class
    - grade
    - course
    - teacher
    - semester
    - academic_year
    - student
    defaults:
      score_status:
      - PUBLISHED
      - LOCKED
      attempt_scope: NORMAL
    clarification:
    - when: metric == '平均分' and course is null
      question: 请确认要统计哪门课程的平均分？
  detail_query:
    examples:
    - 查陈晨这学期数学成绩
    - 我的期末成绩
    - 王浩的补考成绩
    required_slots:
    - student
    optional_slots:
    - course
    - semester
    - attempt_type
    defaults:
      score_status:
      - PUBLISHED
      - LOCKED
  ranking:
    examples:
    - 高二(1)班数学成绩排名前10
    - 我班数学谁第一名
    required_slots:
    - class
    - course
    - metric
    optional_slots:
    - semester
    - limit
    defaults:
      score_status:
      - PUBLISHED
      - LOCKED
      attempt_scope: NORMAL
    clarification:
    - when: ranking_scope is null
      question: 请确认是班级排名、年级排名还是全校排名？
  trend:
    examples:
    - 数学平均分按学期变化
    - 我的成绩趋势
    required_slots:
    - metric
    - time_dimension
    optional_slots:
    - class
    - course
    - teacher
    - student
    defaults:
      score_status:
      - PUBLISHED
      - LOCKED
  comparison:
    examples:
    - 两个班英语平均分对比
    - 我的数学和语文成绩对比
    required_slots:
    - metric
    - compare_dimension
    optional_slots:
    - semester
    - course
  distribution:
    examples:
    - 物理成绩分数段分布
    - 高二(1)班数学成绩分布
    required_slots:
    - course
    optional_slots:
    - class
    - semester
    defaults:
      score_status:
      - PUBLISHED
      - LOCKED
      attempt_scope: NORMAL
  transcript_report:
    examples:
    - 生成我的第一学期成绩单
    - 查陈晨的成绩单
    required_slots:
    - student
    optional_slots:
    - semester
    defaults:
      transcript_status:
      - ISSUED
  anomaly_scan:
    examples:
    - 连续两次数学不及格的学生
    - 哪些学生需要补考
    required_slots:
    - course
    - condition
    optional_slots:
    - class
    - semester
    defaults:
      score_status:
      - PUBLISHED
      - LOCKED
security:
  enforcement: application_layer_authorized_tables
  fail_closed: true
  default_role: student
  roles:
    student:
      description: 学生只能查看本人成绩和本人成绩单
      required_context:
      - student_no
      allowed_tables:
      - authorized_score
      - authorized_effective_score
      - authorized_transcript
      row_scope: student_no = :student_no
    teacher:
      description: 教师只能查看自己任教教学班的成绩，不能查看其他科目或其他教师教学班
      required_context:
      - teacher_no
      allowed_tables:
      - authorized_score
      - authorized_effective_score
      row_scope: teacher_no = :teacher_no
    admin:
      description: 教务管理员可以查看全部成绩和成绩单
      required_context: []
      allowed_tables:
      - authorized_score
      - authorized_effective_score
      - authorized_transcript
      row_scope: 1 = 1
  notes:
  - authorized_score 由 v_published_transcript 按当前用户过滤后生成
  - authorized_effective_score 由 v_effective_score 按当前用户过滤后生成
  - 教师不可访问 authorized_transcript，因为成绩单包含其他科目
  - 学生查询其他学生时结果为空，不泄露其他学生是否存在
quality_rules:
- name: published_only
  description: 只统计已发布或已锁定成绩
  expression: score_status IN ('PUBLISHED','LOCKED')
- name: exclude_withdrawn
  description: 排除退课记录
  expression: attempt_type IS NOT NULL
- name: effective_score
  description: GPA、及格率、排名默认使用有效成绩
  expression: v_effective_score
- name: missing_score
  description: 未录入成绩默认排除，不按0分计算
  expression: total_score IS NOT NULL
- name: class_attribution
  description: 班级维度默认使用当前行政班，转班历史需扩展 student_class_history
  expression: student.class_id
- name: combined_class
  description: 教学班覆盖多个行政班时，不能用 teaching_class_class 直接计算学生班级平均分
  expression: teaching_class_class
- name: transcript_snapshot
  description: 正式成绩单以 transcript.snapshot_json 为准，不随成绩修改变化
  expression: transcript.snapshot_json
