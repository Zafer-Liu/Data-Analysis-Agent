version: 2

# Routine version updates are monthly and grouped by ecosystem.
# Major upgrades are reviewed manually. The allow rules below apply only to
# version updates; security updates retain their separate GitHub behavior.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    allow:
      - dependency-name: "*"
        update-types:
          - version-update:semver-minor
          - version-update:semver-patch
    groups:
      frontend-minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
    labels:
      - dependencies
    commit-message:
      prefix: "chore(deps)"
      include: scope

  # Python backend and optional manifests in requirements/.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    allow:
      - dependency-name: "*"
        update-types:
          - version-update:semver-minor
          - version-update:semver-patch
    groups:
      python-minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
    labels:
      - dependencies
    commit-message:
      prefix: "chore(deps)"
      include: scope
    ignore:
      # Keep the supported Python 3.10 and macOS Intel installation paths.
      - dependency-name: scikit-learn
        versions: [">=1.8.0"]
      - dependency-name: onnxruntime
        versions: [">=1.24.0"]
      # GPU packages must be selected for the user's CUDA/driver matrix.
      - dependency-name: torch
      - dependency-name: torchvision
      - dependency-name: torchaudio

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    allow:
      - dependency-name: "*"
        update-types:
          - version-update:semver-minor
          - version-update:semver-patch
    groups:
      actions-minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: "chore(ci)"
