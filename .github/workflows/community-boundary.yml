name: Community repository boundary

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    if: github.repository == 'Zafer-Liu/Data-Analysis-Agent'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Reject hosted-edition and runtime-only files
        run: python .github/scripts/check_community_boundary.py
