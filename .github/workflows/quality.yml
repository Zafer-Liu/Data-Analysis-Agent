name: Public source quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: public-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Public runtime contracts
    runs-on: ubuntu-latest
    env:
      BAA_DATA_DIR: ${{ runner.temp }}/baa-quality-python
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements/test.txt
      - name: Reject private publication paths
        run: python scripts/check_public_boundary.py
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt -r requirements/test.txt
      - name: Check public tool contracts
        run: python scripts/check_tool_contracts.py
      - name: Compile public runtime sources
        run: python -m compileall -q agent api data infrastructure remote_runner app.py
      - name: Run existing module chart checks
        run: python -m pytest Function/Charts_generation/tests -q

  frontend:
    name: Frontend build and asset checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Reject private publication paths
        run: python scripts/check_public_boundary.py
      - uses: pnpm/action-setup@v6
        with:
          version: 11.7.0
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Check formatting and lint
        run: pnpm run format:check && pnpm run lint
      - name: Build and verify frontend assets
        run: pnpm run build:chat
