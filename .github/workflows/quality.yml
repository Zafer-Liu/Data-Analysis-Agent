name: Required regression quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: required-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Shared Python contracts
    runs-on: ubuntu-latest
    env:
      BAA_DATA_DIR: ${{ runner.temp }}/baa-quality-python
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements/*.txt
      - name: Require shared regression files
        run: python scripts/run_required_regressions.py --check-only
      - name: Install CPU training test dependency
        run: python -m pip install 'torch>=2.9.1,<3' --index-url https://download.pytorch.org/whl/cpu
      - name: Install runtime and test dependencies
        run: python -m pip install -r requirements.txt -r requirements/test.txt
      - name: Check tool inventory
        run: python scripts/generate_tool_inventory.py --check
      - name: Run shared Python regressions
        run: python scripts/run_required_regressions.py --suite python

  frontend:
    name: Chat bundle and frontend contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Require shared regression files
        run: python scripts/run_required_regressions.py --check-only
      - uses: pnpm/action-setup@v6
        with:
          version: 11.7.0
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Build and verify chat assets
        run: pnpm run build:chat
      - name: Run shared frontend regressions
        run: python scripts/run_required_regressions.py --suite frontend
